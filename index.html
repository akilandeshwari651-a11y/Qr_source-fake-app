<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QRShield - Team CipherX</title>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: auto; padding: 16px; background: #eaf1f8; color: #16314f; }
  h1 { margin-bottom: 0; color: #0b1f3a; }
  button { padding: 10px 16px; font-size: 16px; margin: 4px 0; border: 0; border-radius: 8px; background: #0b1f3a; color: #fff; }
  button.alt { background: #dfe8f2; color: #0b1f3a; }
  input[type=text] { width: 65%; padding: 10px; font-size: 16px; }
  #result { display: none; background: #fff; padding: 16px; border-radius: 10px; margin-top: 16px; }
  #badge { font-size: 22px; font-weight: bold; padding: 8px 16px; border-radius: 20px; color: #fff; display: inline-block; }
  .safe { background: #2e7d5b; } .suspicious { background: #f5a524; color: #0b1f3a !important; } .dangerous { background: #d93a41; }
  #link { word-break: break-all; background: #f3f7fb; padding: 8px; border-radius: 6px; font-family: monospace; }
  footer { margin-top: 24px; font-size: 13px; color: #5b6f86; text-align: center; }
</style>
</head>
<body>
<h1>QRShield</h1>
<p>Know the link before you open it</p>

<button onclick="startScan()">Start camera</button>
<button class="alt" onclick="document.getElementById('file').click()">Upload QR image</button>
<input type="file" id="file" accept="image/*" style="display:none" onchange="scanFile(this.files[0])">
<div id="reader"></div>

<p>Or paste a link:</p>
<input type="text" id="manual" placeholder="https://example.com">
<button class="alt" onclick="check(document.getElementById('manual').value)">Check</button>

<div id="result">
  <span id="badge"></span>
  <h3>Risk score: <span id="score"></span>/100</h3>
  <div id="link"></div>
  <b>Why?</b>
  <ul id="reasons"></ul>
  <button onclick="location.reload()">Don't open</button>
  <button class="alt" onclick="report()">Report this QR</button>
  <p id="msg"></p>
</div>

<h3>Recent scans</h3>
<ul id="history"></ul>

<footer>Team CipherX | SRM TRP Engineering College</footer>

<script>
let scanner, lastUrl = "";

async function startScan() {
  scanner = new Html5Qrcode("reader");
  try {
    await scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, async text => {
      await scanner.stop();
      check(text);
    });
  } catch (e) {
    alert("Camera could not start. Allow camera access, or upload a QR image instead.");
  }
}

async function scanFile(file) {
  if (!file) return;
  scanner = scanner || new Html5Qrcode("reader");
  try { check(await scanner.scanFile(file, false)); }
  catch (e) { alert("No QR code found in that image"); }
}

async function check(url) {
  if (!url || !url.trim()) return;
  const res = await fetch("/check", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ url })
  });
  const d = await res.json();
  lastUrl = d.url;
  document.getElementById("result").style.display = "block";
  const badge = document.getElementById("badge");
  badge.textContent = d.verdict.toUpperCase();
  badge.className = d.verdict;
  document.getElementById("score").textContent = d.score;
  document.getElementById("link").textContent = d.url;
  const list = document.getElementById("reasons");
  list.innerHTML = "";
  d.reasons.forEach(r => {
    const li = document.createElement("li");
    li.textContent = r;
    list.appendChild(li);
  });
  document.getElementById("msg").textContent = "";
  document.getElementById("result").scrollIntoView({ behavior: "smooth" });
  loadHistory();
}

async function report() {
  await fetch("/report", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ url: lastUrl })
  });
  document.getElementById("msg").textContent = "Reported. The next scan of this link will be flagged.";
}

async function loadHistory() {
  const rows = await (await fetch("/history")).json();
  const list = document.getElementById("history");
  list.innerHTML = "";
  rows.forEach(r => {
    const li = document.createElement("li");
    li.textContent = r.verdict.toUpperCase() + " (" + r.score + ") - " + r.url;
    list.appendChild(li);
  });
}
loadHistory();
</script>
</body>
</html>
